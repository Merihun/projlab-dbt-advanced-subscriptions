# Starter-repository CI: installs the pinned requirements and runs the tests that do not need
# the lab services (databases, brokers). Service tests run inside your lab: `python -m pytest -q`.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m "not service"
